apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gitops-demo
  template:
    metadata:
      labels:
        app: gitops-demo
    spec:
      containers:
        - name: gitops-demo
          image: gitops-demo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: gitops-demo-service
spec:
  type: NodePort
  selector:
    app: gitops-demo
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
